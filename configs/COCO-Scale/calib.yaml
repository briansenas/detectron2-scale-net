_BASE_: "../COCO-Keypoints/keypoint_rcnn_R_50_FPN_3x.yaml"
MODEL:
  WEIGHTS: "models/detectron2-R50-KeypointDetection.pkl"
  META_ARCHITECTURE: "CameraRCNN"
  PROPOSAL_GENERATOR:
    NAME: "PrecomputedProposals"
  KEYPOINT_ON: False
  # Freeze the whole backbone to fine tune the calibration heads.
  BACKBONE:
    FREEZE_AT: 5
  CAMERA_HEAD:
    LOSS_CRITERION: "softargmax_l2_biased"
    PITCH_WEIGHT: 10.
    ROLL_WEIGHT: 10.
    VFOV_WEIGHT: 10.
    NUM_CONV: 4
DATASETS:
  TRAIN: ("Pano360_train", )
  TEST: ("Pano360_val", )
SOLVER:
  # The dataset total size is 187206, 2000 for validation.
  IMS_PER_BATCH: 36  # 16 for 1 gpu 48 for 3 gpus.
  BASE_LR: 0.0140625   # 0.0046875 for 1 gpu 0.01875 for 3 gpu
  STEPS: (60000, 80000)
  MAX_ITER: 90000
  AMP:
    ENABLED: True
  CLIP_GRADIENTS:
    CLIP_TYPE: norm
    CLIP_VALUE: 1.0
    ENABLED: true
    NORM_TYPE: 2.0
TEST:
  EVAL_PERIOD: 2000
DATALOADER:
  NUM_WORKERS: 2
  FILTER_EMPTY_ANNOTATIONS: False
  ASPECT_RATIO_GROUPING: True
VIS_PERIOD: 2000
FLOAT32_PRECISION: "medium"
SEED: 140421
OUTPUT_DIR: "output/calib-only-1gpu-biasl2"
