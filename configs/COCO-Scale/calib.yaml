_BASE_: "../COCO-Keypoints/keypoint_rcnn_R_50_FPN_3x.yaml"
MODEL:
  WEIGHTS: "models/detectron2-R50-KeypointDetection.pkl"
  META_ARCHITECTURE: "CameraRCNN"
  PROPOSAL_GENERATOR:
    NAME: "PrecomputedProposals"
  KEYPOINT_ON: False
DATASETS:
  TRAIN: ("Pano360_train", )
  TEST: ("Pano360_val", )
SOLVER:
  # The dataset total size is 187206, 2000 for validation.
  IMS_PER_BATCH: 48  # 16 for 1 gpu 48 for 3 gpus.
  BASE_LR: 0.01875   # 0.00625 for 1 gpu 0.01875 for 3 gpu
  STEPS: (13000, 17000)
  MAX_ITER: 20000
  AMP:
    ENABLED: True
TEST:
  EVAL_PERIOD: 2000
DATALOADER:
  NUM_WORKERS: 2
  FILTER_EMPTY_ANNOTATIONS: False
  ASPECT_RATIO_GROUPING: True
VIS_PERIOD: 500
FLOAT32_PRECISION: "medium"
