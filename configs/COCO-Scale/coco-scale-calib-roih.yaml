_BASE_: "../COCO-Keypoints/keypoint_rcnn_R_50_FPN_3x.yaml"
MODEL:
  WEIGHTS: "output/kpsbbox-calib-v2/model_final.pth"
  META_ARCHITECTURE: "GeneralizedCamRCNN"
  ROI_HEADS:
    NAME: "HeightStandardROIHeads"
  ROI_BOX_HEAD:
    BBOX_REG_LOSS_WEIGHT: 10.0
  ROI_KEYPOINT_HEAD:
    NAME: "KRCNNConvDeconvUpsampleHead"
    LOSS_WEIGHT: 10.0
  KEYPOINT_ON: False
  HEIGHT_ON: True
  HEIGHT_REFINE_ON: True
  HEIGHT_HEAD:
    LOSS_WEIGHT: 0.05
    REDUCE_METHOD: "softmax"
    SMOOTH_L1_BETA: 0.1
  POINT_NET:
    POOLING: "max"
    TEMPERATURE: 0.75
    BN: True
    TRANSFORM: True
    DETACH: False
    REFINE_TEMPERATURE: 0.75
    REFINE_LAYERS: 2  # Only applies at HEIGHT_REFINE_ON: TRUE
DATASETS:
  TRAIN: ("COCOScale2017Calib_train", )
  TEST: ()
SOLVER:
  # The dataset total size is 187206, 2000 for validation.
  # IMS_PER_BATCH: 4 (No Height + AMP) - 3 (Height + AMP) - 2 (Height + Refine + AMP) - (2 Height + Refine)
  # ASSUMING RATIO (3,1) -- which we can also tune if batch size is hard to
  # With refine we can try 2x(4, 2) or just scale with more than 1 gpu.
  IMS_PER_BATCH: 6  # 2-1gpu 6-3gpu
  RATIO_PANO360: (3, 1)  # 3 COCO, 1 CALIB
  BASE_LR: 0.00025  # 0.002343 1gpu 0.007031 3 gpu (diverges?)
  STEPS: (20000, 26000)
  MAX_ITER: 30000
  AMP:
    ENABLED: True
TEST:
  EVAL_PERIOD: 0
DATALOADER:
  NUM_WORKERS: 2
  FILTER_EMPTY_ANNOTATIONS: False
  ASPECT_RATIO_GROUPING: True
VIS_PERIOD: 500
FLOAT32_PRECISION: "medium"
SEED: 140421
