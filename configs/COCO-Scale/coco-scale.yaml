_BASE_: "../COCO-Keypoints/keypoint_rcnn_R_50_FPN_3x.yaml"
MODEL:
  WEIGHTS: "models/detectron2-R50-KeypointDetection.pkl"
  KEYPOINT_ON: True
DATASETS:
  TRAIN: ("COCOScale2017_train", )
  TEST: ("COCOScale2017_val", )
SOLVER:
  # The dataset total size is 187206, 2000 for validation.
  IMS_PER_BATCH: 36  # 16 for 1 gpu 48 for 3 gpus.
  BASE_LR: 0.0140625   # 0.0046875 for 1 gpu 0.01875 for 3 gpu
  STEPS: (60000, 80000)
  MAX_ITER: 90000
  AMP:
    ENABLED: True
  CLIP_GRADIENTS:
    CLIP_TYPE: norm
    CLIP_VALUE: 1.0
    ENABLED: true
    NORM_TYPE: 2.0
TEST:
  EVAL_PERIOD: 0
DATALOADER:
  NUM_WORKERS: 2
  FILTER_EMPTY_ANNOTATIONS: True
  ASPECT_RATIO_GROUPING: True
VIS_PERIOD: 500
FLOAT32_PRECISION: "medium"
SEED: 140421
