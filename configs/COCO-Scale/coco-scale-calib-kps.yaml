_BASE_: "../COCO-Keypoints/keypoint_rcnn_R_50_FPN_3x.yaml"
MODEL:
  WEIGHTS: "output/calib-only-1gpu-biasl2/model_final.pth"
  META_ARCHITECTURE: "GeneralizedCamRCNN"
  ROI_HEADS:
    NAME: "HeightStandardROIHeads"
  ROI_BOX_HEAD:
    BBOX_REG_LOSS_WEIGHT: 10.0
  ROI_KEYPOINT_HEAD:
    NAME: "KRCNNConvDeconvUpsampleHeadHeightPred"
    LOSS_WEIGHT: 10.0
  KEYPOINT_ON: True
  HEIGHT_ON: False
  POINT_NET_ON: False
  HEIGHT_REFINE_ON: False
  HEIGHT_MEAN: 1.75
  HEIGHT_STD: 0.2
  HEIGHT_HEAD:
    LOSS_WEIGHT: 0.05
    SMOOTH_L1_BETA: 0.1
  POINT_NET:
    POOLING: "max"
    TEMPERATURE: 1.0
    BN: False
    TRANSFORM: True
    DETACH: False
    REFINE_TEMPERATURE: 1.0
    REFINE_LAYERS: 2  # Only applies at HEIGHT_REFINE_ON: TRUE
  CAMERA_HEAD:
    LOSS_CRITERION: "softargmax_l2_biased"
    PITCH_WEIGHT: 10.
    ROLL_WEIGHT: 10.
    VFOV_WEIGHT: 10.
    NUM_CONV: 4
DATASETS:
  TRAIN: ("COCOScale2017Calib_train", )
  TEST: ("Pano360_val", "COCOScale2017_val",)
SOLVER:
  # The dataset total size is 187206, 2000 for validation.
  IMS_PER_BATCH: 6  # 2-1gpu 6-3gpu
  RATIO_PANO360: (3, 1)  # 3 COCO, 1 CALIB
  BASE_LR: 0.007031  # 0.002343 1gpu 0.007031 3 gpu (diverges?)
  STEPS: (60000, 80000)
  MAX_ITER: 90000
  AMP:
    ENABLED: True
  CLIP_GRADIENTS:
    CLIP_TYPE: norm
    CLIP_VALUE: 1.0
    ENABLED: true
    NORM_TYPE: 2.0
TEST:
  EVAL_PERIOD: 2000
DATALOADER:
  NUM_WORKERS: 2
  FILTER_EMPTY_ANNOTATIONS: False
  ASPECT_RATIO_GROUPING: True
VIS_PERIOD: 2000
FLOAT32_PRECISION: "medium"
SEED: 140421
OUTPUT_DIR: "output/coco-scale-kps-biasl2"
